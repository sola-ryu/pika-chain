<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pika-chain — Markov chain Pokémon text generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌩️ pika-chain</h1>
      <p class="subtitle">Markov chain Pokémon text generator — powered by chaos and vibes</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <label for="species">Species</label>
        <select id="species">
          <option value="pikachu" selected>⚡ Pikachu</option>
          <option value="charmander">🔥 Charmander</option>
          <option value="jigglypuff">🎈 Jigglypuff</option>
        </select>
      </div>

      <div class="control-group">
        <label for="order">N-gram order</label>
        <input type="range" id="order" min="1" max="4" value="1">
        <span class="value-display">1</span>
      </div>

      <div class="control-group">
        <label for="count">Outputs</label>
        <input type="number" id="count" min="1" max="50" value="5">
      </div>

      <div class="control-group">
        <label for="length-max">Max length</label>
        <input type="range" id="length-max" min="3" max="30" value="15">
        <span class="value-display">15</span>
      </div>

      <button id="generate">⚡ Generate</button>
    </div>

    <div id="corpus-info" class="info-bar">Loading…</div>

    <div id="output" class="output"></div>

    <footer>
      <a href="https://github.com/sola-ryu/pika-chain">🔗 GitHub</a>
      <span>•</span>
      <span>Corpus in <code>corpus/*.json</code></span>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
